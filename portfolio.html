<script>/* light or dark before the first paint: the visitor's last choice on the switch (saved as "lamp"), else their device */
try { var lamp = localStorage.getItem('lamp'); } catch (e) {}
document.documentElement.dataset.theme = (lamp ? lamp === 'on' : matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';</script>

<script>
/* the page slides in from the side the visitor is heading to (set by the link clicked, site.js); reloads just appear */
addEventListener('pagereveal', async (e) => {
  const dir = sessionStorage.getItem('slide');
  sessionStorage.removeItem('slide');
  if (!e.viewTransition) return;
  if (!dir) return e.viewTransition.skipTransition();
  document.documentElement.dataset.slide = dir;
  await e.viewTransition.finished;
  delete document.documentElement.dataset.slide;
});
</script>

<!-- paper grain for the cut-out letters, the same as on the cutting mat -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="paper" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".09 .05" numOctaves="3" seed="4" result="n"/>
    <feColorMatrix in="n" values="0 0 0 0 .55  0 0 0 0 .48  0 0 0 0 .36  0 0 0 -2.4 1.05" result="fibres"/>
    <feComposite in="fibres" in2="SourceGraphic" operator="in" result="grain"/>
    <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="grain"/></feMerge>
  </filter>
</svg>
