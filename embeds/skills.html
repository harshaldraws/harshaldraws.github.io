<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Core Skills &amp; Core Toolkit</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--ink:#fff;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:#000;color:var(--ink);font-family:"Inter","Segoe UI",system-ui,sans-serif;overflow:hidden;position:relative}
#wrap{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr}
.view{display:block;width:100%;height:100%;min-width:0;min-height:0;cursor:grab;touch-action:none}
.view.drag{cursor:grabbing}
@media (max-aspect-ratio:1/1){#wrap{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}
</style>
</head>
<body>
<div id="wrap">
<canvas id="cubeCanvas" class="view"></canvas>
<canvas id="dodCanvas" class="view"></canvas>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* GrainFace: per-face canvas texture. On hover, a fine grainy colour gradient
   starts around the cursor and spreads until it fills the whole face.
   Non-hovered faces are blurred (focus effect). */
window.glowBlob=function(c,cx,cy,rx,ry){c.save();c.translate(cx,cy);c.scale(1,ry/rx);var g=c.createRadialGradient(0,0,0,0,0,rx);g.addColorStop(0,"rgba(255,255,255,0.26)");g.addColorStop(0.5,"rgba(255,255,255,0.10)");g.addColorStop(1,"rgba(255,255,255,0)");c.shadowBlur=0;c.fillStyle=g;c.beginPath();c.arc(0,0,rx,0,Math.PI*2);c.fill();c.restore();};
window.GrainFace=function(o){
var S=512,G=384,K=S/G;
function hex(h){var n=parseInt(h.slice(1),16);return [n>>16&255,n>>8&255,n&255];}
var F=hex(o.fill),T=hex(o.text);
var HC=((0.299*F[0]+0.587*F[1]+0.114*F[2])/255>0.8)?T:[255,255,255]; /* highlight colour: white, or the text colour on very light faces */
function mk(w){var k=document.createElement("canvas");k.width=k.height=w;return k;}
var cv=mk(S),c=cv.getContext("2d");          /* final texture */
var sh=mk(S),sc=sh.getContext("2d");         /* sharp composition */
var gcv=mk(G),gc=gcv.getContext("2d");       /* grain layer */
var img=gc.createImageData(G,G),data=img.data;
var n1=new Float32Array(G*G),n2=new Float32Array(G*G),n3=new Float32Array(G*G);
for(var i=0;i<G*G;i++){n1[i]=Math.random();n2[i]=Math.random();n3[i]=Math.random();}
function layer(fn){var k=mk(S);fn(k.getContext("2d"));return k;}
var border=layer(function(x){o.drawBorder(x);});
var labN=layer(function(x){o.drawLabel(x,false);});
var labH=layer(function(x){o.drawLabel(x,true);});
/* glow halo of the label, plus a scratch canvas used to mask it around the cursor */
var glowL=layer(function(x){x.shadowColor="rgba("+T+",0.95)";x.shadowBlur=26;x.shadowOffsetX=S*2;x.drawImage(labH,-S*2,0);x.drawImage(labH,-S*2,0);});
var gmc=mk(S),gmx=gmc.getContext("2d");

/* blur chain: down-sample then up-sample with smoothing */
var bsz=[152,76,38,24],bc=bsz.map(mk),bx=bc.map(function(k){var q=k.getContext("2d");q.imageSmoothingEnabled=true;q.imageSmoothingQuality="high";return q;});
var blurCv=mk(S),blurCtx=blurCv.getContext("2d");
blurCtx.imageSmoothingEnabled=true;blurCtx.imageSmoothingQuality="high";
var blurDirty=true;
function makeBlur(){
var prev=sh,k;
for(k=0;k<bc.length;k++){bx[k].clearRect(0,0,bsz[k],bsz[k]);bx[k].drawImage(prev,0,0,bsz[k],bsz[k]);prev=bc[k];}
for(k=bc.length-1;k>0;k--){bx[k-1].clearRect(0,0,bsz[k-1],bsz[k-1]);bx[k-1].drawImage(bc[k],0,0,bsz[k-1],bsz[k-1]);}
blurCtx.clearRect(0,0,S,S);blurCtx.drawImage(bc[0],0,0,S,S);
blurDirty=false;
self.backTex.needsUpdate=true;
}

var prog=0,on=false,ox=S/2,oy=S/2,tx=S/2,ty=S/2,dirty=false,blur=0,bt=0,hx=S/2,hy=S/2,htx=S/2,hty=S/2;
var self={};
self.tex=new THREE.CanvasTexture(cv);self.tex.anisotropy=4;
self.backTex=new THREE.CanvasTexture(blurCv);
var backOn=true;
self.setBack=function(v){backOn=!!v;if(backOn)blurDirty=true;dirty=true;};

self.set=function(active,x,y){
if(active){
if(!on){ox=tx=S/2;oy=ty=S/2;hx=x;hy=y;}
htx=x;hty=y;
}
on=active;
};
self.setBlur=function(t){bt=t;};

function compose(){
sc.clearRect(0,0,S,S);
sc.save();
o.clipPath(sc);
sc.fillStyle="rgba(255,255,255,0.24)";
sc.fill();
if(prog>0.001){
sc.clip();
var corners=[[0,0],[S,0],[0,S],[S,S]],Rm=0;
for(var q=0;q<4;q++){Rm=Math.max(Rm,Math.hypot(corners[q][0]-ox,corners[q][1]-oy));}
var soft=120,e=1-Math.pow(1-prog,3),R=e*(Rm+soft),gs=1/(Rm*0.9);
for(var y=0;y<G;y++){
var dy=(y+0.5)*K-oy;
for(var x=0;x<G;x++){
var i=y*G+x,p=i*4,dx=(x+0.5)*K-ox,d=Math.sqrt(dx*dx+dy*dy),cov=(R-d)/soft;
if(cov<=0||n1[i]>cov*2.6){data[p+3]=0;continue;}
var g=1-d*gs;if(g<0)g=0;g=g*g;
var m=0.5*g,j=0.965+0.07*n2[i];
var r=(F[0]+(T[0]-F[0])*m)*j,gg=(F[1]+(T[1]-F[1])*m)*j,b=(F[2]+(T[2]-F[2])*m)*j;
data[p]=r>255?255:r;data[p+1]=gg>255?255:gg;data[p+2]=b>255?255:b;
var edge=cov*2.2;if(edge>1)edge=1;
data[p+3]=255*(0.82+0.06*n3[i])*edge;
}
}
gc.putImageData(img,0,0);
sc.imageSmoothingEnabled=true;
sc.globalAlpha=Math.min(1,prog*6);
sc.drawImage(gcv,0,0,S,S);
sc.globalAlpha=1;

}
sc.restore();
sc.drawImage(border,0,0);
var pl=Math.min(1,prog*3);
sc.globalAlpha=1-pl;sc.drawImage(labN,0,0);
sc.globalAlpha=pl;sc.drawImage(labH,0,0);
sc.globalAlpha=1;
/* numbers, logo and text glow up near the cursor */
var ga=Math.min(1,prog*2);
if(ga>0.01){
gmx.globalCompositeOperation="source-over";gmx.globalAlpha=1;
gmx.clearRect(0,0,S,S);
gmx.drawImage(glowL,0,0);
gmx.globalCompositeOperation="destination-in";
var mg=gmx.createRadialGradient(hx,hy,0,hx,hy,200);
mg.addColorStop(0,"rgba(0,0,0,1)");mg.addColorStop(0.45,"rgba(0,0,0,0.6)");mg.addColorStop(1,"rgba(0,0,0,0)");
gmx.fillStyle=mg;gmx.fillRect(0,0,S,S);
gmx.globalCompositeOperation="source-over";
sc.save();o.clipPath(sc);sc.clip();
sc.globalCompositeOperation="color-burn";
sc.globalAlpha=ga*0.85;sc.drawImage(gmc,0,0);
sc.restore();
}
blurDirty=true;
}

function finish(){
c.clearRect(0,0,S,S);
if(backOn&&blurDirty)makeBlur();
if(blur>0.001){
if(blurDirty)makeBlur();
c.globalAlpha=1-blur;c.drawImage(sh,0,0);
c.globalCompositeOperation="lighter";
c.globalAlpha=blur;c.drawImage(blurCv,0,0);
c.globalCompositeOperation="source-over";
c.globalAlpha=1;
}else c.drawImage(sh,0,0);
self.tex.needsUpdate=true;
}

self.update=function(dt){
var old=prog,ob=blur;
if(on)prog=Math.min(1,prog+dt/1.1);else prog=Math.max(0,prog-dt/0.45);
var k=Math.min(1,dt*10),mx=(tx-ox)*k,my=(ty-oy)*k;
if(on){ox+=mx;oy+=my;}
var kh=Math.min(1,dt*14),hmx=(htx-hx)*kh,hmy=(hty-hy)*kh;
if(on){hx+=hmx;hy+=hmy;}
if(blur<bt)blur=Math.min(bt,blur+dt/0.35);else if(blur>bt)blur=Math.max(bt,blur-dt/0.35);
var sharpChanged=dirty||prog!==old||(on&&(Math.abs(mx)>0.05||Math.abs(my)>0.05||Math.abs(hmx)>0.05||Math.abs(hmy)>0.05));
if(sharpChanged){dirty=false;compose();}
if(sharpChanged||blur!==ob)finish();
};
compose();finish();
return self;
};
/* BackFaces: renders the far-side faces (seen through the selected face) using the blurred texture.
   They fade in only while a face is selected; all other faces stay sharp. */
window.BackFaces=function(shell,fxs,parent){
var bm=fxs.map(function(f){return new THREE.MeshBasicMaterial({map:f.backTex,color:0x444444,transparent:true,opacity:1,side:THREE.BackSide,depthWrite:false});});
var m=new THREE.Mesh(shell.geometry,bm);m.renderOrder=-2;m.visible=true;parent.add(m);
var op=1;
return {update:function(on){
op+=((on?1:0)-op)*0.12;if(op<0.003&&!on)op=0;
m.visible=op>0;bm.forEach(function(x){x.opacity=op;});
}};
};
/* GlassLight: light from below, shaded like thick glass. A lit additive overlay on the shape's own
   geometry (never the background): refracted cool glow rising from the bottom, fresnel rim for the
   glass thickness, and tiny dispersed glints. The far (inside) faces get a dimmer version. */
window.GlassLight=function(shell,parent,R){
function mat(back){
return new THREE.ShaderMaterial({
uniforms:{uR:{value:R},uBack:{value:back?1:0}},
transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,depthTest:true,
side:back?THREE.BackSide:THREE.FrontSide,
vertexShader:"varying vec3 vN;varying vec3 vW;void main(){vN=normalize(mat3(modelMatrix)*normal);vec4 w=modelMatrix*vec4(position,1.0);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}",
fragmentShader:[
"uniform float uR;uniform float uBack;varying vec3 vN;varying vec3 vW;",
"void main(){",
"vec3 N=normalize(vN);if(uBack>0.5)N=-N;",
"vec3 V=normalize(cameraPosition-vW);",
"vec3 L=normalize(vec3(0.12,-1.0,0.5));",              /* light sits below, slightly in front */
"float ndl=max(dot(N,L),0.0);",
"float h=clamp(0.5-vW.y/(uR*2.0),0.0,1.0);",           /* 1 at the bottom of the shape */
"float fres=pow(1.0-max(dot(N,V),0.0),3.0);",
"vec3 H=normalize(L+V);float nh=max(dot(N,H),0.0);",
"vec3 spec=vec3(pow(nh,34.0),pow(nh,48.0),pow(nh,70.0));", /* slight dispersion per channel */
"vec3 glow=vec3(0.50,0.72,1.0)*pow(h,2.2)*(0.30+0.70*ndl)*0.34;", /* light bent up through thick glass */
"vec3 rim=vec3(0.70,0.85,1.0)*fres*(0.18+0.82*ndl)*0.40;",       /* glass thickness at grazing angles */
"vec3 col=spec*0.85+glow+rim+vec3(0.8,0.9,1.0)*ndl*0.05;",
"if(uBack>0.5)col*=0.55;",
"gl_FragColor=vec4(col,1.0);",
"}"].join("\n")
});
}
var f=new THREE.Mesh(shell.geometry,mat(false));f.renderOrder=2;parent.add(f);
var k=new THREE.Mesh(shell.geometry,mat(true));k.renderOrder=-1.8;parent.add(k);
};

/* EdgeBlur: edges behind the front faces are drawn into a render target and gaussian-blurred. The result is
   shown only through the front faces (masked to the shell), layered above the back lines/faces and below the
   front faces. Front edges stay sharp; the two cross-fade. */
window.EdgeBlur=function(renderer,scene,camera,parent,lines,R,shell){
var o={minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,format:THREE.RGBAFormat,depthBuffer:false};
var rtA=new THREE.WebGLRenderTarget(2,2,o),rtB=new THREE.WebGLRenderTarget(2,2,o);
var VS="varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.0,1.0);}";
var TAPS="vec4 c=texture2D(t,vUv)*0.227027;"+
"c+=(texture2D(t,vUv+d)+texture2D(t,vUv-d))*0.1945946;"+
"c+=(texture2D(t,vUv+d*2.0)+texture2D(t,vUv-d*2.0))*0.1216216;"+
"c+=(texture2D(t,vUv+d*3.0)+texture2D(t,vUv-d*3.0))*0.054054;"+
"c+=(texture2D(t,vUv+d*4.0)+texture2D(t,vUv-d*4.0))*0.016216;";
var hMat=new THREE.ShaderMaterial({uniforms:{t:{value:rtA.texture},d:{value:new THREE.Vector2()}},
vertexShader:VS,fragmentShader:"uniform sampler2D t;uniform vec2 d;varying vec2 vUv;void main(){"+TAPS+"gl_FragColor=c;}",
depthTest:false,depthWrite:false});
/* The blurred back-lines are NOT drawn as a screen-wide layer. They are painted onto the front faces
   (same geometry as the shell, front side only), sampling the blurred image at each pixel's screen position.
   So the blur is confined to the silhouette and reads as frosted glass in front of the lines, not blur on the lines. */
var cMat=new THREE.ShaderMaterial({uniforms:{t:{value:rtB.texture},d:{value:new THREE.Vector2()},gain:{value:7},uRes:{value:new THREE.Vector2(1,1)}},
vertexShader:"void main(){gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}",
fragmentShader:"uniform sampler2D t;uniform vec2 d;uniform float gain;uniform vec2 uRes;void main(){vec2 vUv=gl_FragCoord.xy/uRes;"+TAPS+"gl_FragColor=vec4(min(c.rgb*gain,vec3(0.3)),1.0);}",
transparent:true,blending:THREE.AdditiveBlending,side:THREE.FrontSide,depthTest:true,depthWrite:false});
var postScene=new THREE.Scene(),postCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
var q1=new THREE.Mesh(new THREE.PlaneGeometry(2,2),hMat);q1.frustumCulled=false;postScene.add(q1);
var glass=new THREE.Mesh(shell.geometry,cMat);glass.renderOrder=-1.5;parent.add(glass);

lines.forEach(function(l){
var lb=new THREE.Line(l.geometry,new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0,depthWrite:false}));
l.userData.base=l.material.opacity;l.userData.pair=lb;lb.userData=l.userData;
lb.layers.set(1);lb.frustumCulled=false;l.parent.add(lb);
});

var tmp=new THREE.Vector3();
function sm(e0,e1,x){var t=Math.max(0,Math.min(1,(x-e0)/(e1-e0)));return t*t*(3-2*t);}
function weights(){
parent.updateMatrixWorld(true);
lines.forEach(function(l){
var u=l.userData;
tmp.copy(u.a).add(u.b).multiplyScalar(0.5).applyMatrix4(parent.matrixWorld);
var w=sm(0.12,-0.28,tmp.z/R);
l.material.opacity=u.base*(1-w);
u.pair.material.opacity=u.base*w;
});
}
return {
resize:function(w,h){
var pr=renderer.getPixelRatio(),rw=Math.max(2,Math.round(w*pr*0.5)),rh=Math.max(2,Math.round(h*pr*0.5));
rtA.setSize(rw,rh);rtB.setSize(rw,rh);
var step=rh*0.010;
hMat.uniforms.d.value.set(step/rw,0);
cMat.uniforms.d.value.set(0,step/rh);
cMat.uniforms.gain.value=20/step;
cMat.uniforms.uRes.value.set(Math.round(w*pr),Math.round(h*pr));
},
render:function(){
weights();
renderer.setClearColor(0x000000,0);
camera.layers.set(1);
renderer.setRenderTarget(rtA);renderer.clear();renderer.render(scene,camera);
renderer.setRenderTarget(rtB);renderer.clear();renderer.render(postScene,postCam);
renderer.setRenderTarget(null);
camera.layers.set(0);
renderer.render(scene,camera);
}
};
};
</script>

[-1,1].forEach(function(a){[-1,1].forEach(function(b){[-1,1].forEach(function(c){V.push(new THREE.Vector3(a,b,c));});});});
[-1,1].forEach(function(a){[-1,1].forEach(function(b){
