<script>
/* the page slides in from the side the visitor is heading to (set by the link clicked, site.js); reloads just appear */
addEventListener('pagereveal', async (e) => {
  const dir = sessionStorage.getItem('slide');
  sessionStorage.removeItem('slide');
  if (!e.viewTransition) return;
  if (!dir) return e.viewTransition.skipTransition();
  document.documentElement.dataset.slide = dir;
  await e.viewTransition.finished;
  delete document.documentElement.dataset.slide;
});
</script>
